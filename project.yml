name: SplitBoard
options:
  bundleIdPrefix: com.sherkhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"   # iPad only: the split keyboard has no purpose on iPhone
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UPQ4QR758Y
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SplitBoard:
    type: application
    platform: iOS
    sources:
      - path: SplitBoard
      # The keyboard sources are compiled into the app as well, so the debug
      # gallery can render the real keyboard for App Store screenshots.
      - path: SplitBoardKeyboard
        excludes:
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sherkhan.splitboard
        PRODUCT_NAME: SplitBoard
        INFOPLIST_FILE: SplitBoard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SplitBoardKeyboard
        embed: true
        codeSign: true

  SplitBoardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SplitBoardKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sherkhan.splitboard.keyboard
        PRODUCT_NAME: SplitBoardKeyboard
        INFOPLIST_FILE: SplitBoardKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  SplitBoard:
    build:
      targets:
        SplitBoard: all
        SplitBoardKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
